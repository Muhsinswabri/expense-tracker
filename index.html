<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chelaveee</title>
    <meta name="application-name" content="Chelaveee" />
    <meta name="description" content="Chelaveee — personal income and expense tracker" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chelaveee" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Apply the saved appearance before first paint (no flash). Kept in sync with src/lib/theme.js.
      ;(function () {
        var t = 'light'
        try { t = localStorage.getItem('chelaveee.theme') || 'light' } catch (e) {}
        document.documentElement.dataset.theme = t
        var c = { light: '#FFFFFF', dark: '#000000' }
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.content = c[t === 'system' ? (m.media.indexOf('dark') > -1 ? 'dark' : 'light') : t]
        })
      })()
    </script>
